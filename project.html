<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="GitHub project details and source code." />
  <meta name="theme-color" content="#0b1020" />
  <title>Project | Brijbhushan Sharma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#0b1020;--panel:#111a2c;--text:#e9effb;--muted:#a5b0c5;--purple:#8e72ff;--cyan:#54c9e8;--line:rgba(255,255,255,.1)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% 5%,#49318b35,transparent 28%),linear-gradient(180deg,#0b1020,#0a1221);color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.65}.container{width:min(900px,calc(100% - 36px));margin:auto}a{color:inherit}.header{border-bottom:1px solid var(--line);background:#0b1020e8}.nav{min-height:70px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;text-decoration:none}.brand span{color:var(--purple)}.back{color:#c6bbff;text-decoration:none;font-size:.9rem}.back:hover{text-decoration:underline}.main{padding-top:55px;padding-bottom:70px}.eyebrow{margin:0 0 10px;color:var(--cyan);font-size:.75rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase}.title{margin:0;font-size:clamp(2.3rem,7vw,4rem);line-height:1.1;letter-spacing:-.06em;overflow-wrap:anywhere}.description{max-width:720px;color:var(--muted);font-size:1.06rem;margin:16px 0 22px}.meta{display:flex;flex-wrap:wrap;gap:9px;margin:20px 0 28px}.badge{padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:#ffffff08;color:#d4def0;font-size:.78rem}.actions{display:flex;flex-wrap:wrap;gap:11px;margin:24px 0}.button{display:inline-flex;align-items:center;justify-content:center;padding:11px 16px;border:1px solid transparent;border-radius:9px;background:linear-gradient(120deg,#8065ef,#399fc7);color:white;text-decoration:none;font:700 .88rem Inter,system-ui,sans-serif;cursor:pointer}.button.secondary{background:#ffffff08;border-color:var(--line)}.button:hover{filter:brightness(1.12)}.notice{padding:15px 17px;border:1px solid #54c9e833;border-radius:11px;background:#54c9e80d;color:#c5d3e8;font-size:.88rem}.readme,.code-panel{margin-top:30px;padding:24px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.readme h2,.code-panel h2{margin:0 0 14px;font-size:1.3rem}.readme-content{white-space:pre-wrap;overflow-wrap:anywhere;color:#c2cce0;font:.88rem/1.75 ui-monospace,SFMono-Regular,Consolas,monospace}.loading,.status{color:var(--muted)}.error{color:#ffb6b6}.code-tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 14px}.code-tools label{color:var(--muted);font-size:.85rem}.code-tools select{max-width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#0b1020;color:var(--text);font:inherit}.code-status{color:var(--muted);font-size:.85rem}.code-scroll{max-height:70vh;overflow:auto;border:1px solid var(--line);border-radius:10px;background:#090e19}.code-scroll pre{margin:0;padding:18px;white-space:pre;tab-size:4;color:#d4def0;font:.82rem/1.65 ui-monospace,SFMono-Regular,Consolas,monospace}.footer{padding:22px 0 30px;border-top:1px solid var(--line);color:var(--muted);font-size:.8rem}.footer a{color:#c6bbff}
    @media(max-width:520px){.main{padding-top:38px}.readme,.code-panel{padding:17px}.code-scroll pre{font-size:.75rem;padding:13px}}
  </style>
</head>
<body>
  <header class="header"><div class="container nav"><a class="brand" href="index.html">Brijbhushan<span>.</span></a><a class="back" href="index.html#projects">← Back to projects</a></div></header>
  <main class="container main">
    <p class="eyebrow" id="language">GitHub project</p>
    <h1 class="title" id="project-name">Loading project…</h1>
    <p class="description" id="description"></p>
    <div class="meta" id="meta"></div>
    <div class="actions" id="actions"></div>
    <p class="notice" id="demo-note" hidden></p>
    <section class="readme"><h2>Project README</h2><div class="readme-content loading" id="readme">Loading repository information…</div></section>
    <section class="code-panel" id="code-panel" hidden aria-labelledby="code-heading">
      <h2 id="code-heading">Project code</h2>
      <div class="code-tools"><label for="code-file">Choose a source file:</label><select id="code-file" hidden></select><span class="code-status" id="code-status" role="status">Choose “View code” to load source files.</span></div>
      <div class="code-scroll" id="code-scroll" hidden><pre><code id="source-code"></code></pre></div>
    </section>
    <p class="error" id="error" role="alert" hidden></p>
  </main>
  <footer class="container footer">Project information is loaded from the public GitHub repository. <a href="https://github.com/Brijbhushan2008">View GitHub profile</a></footer>
  <script>
    const owner='Brijbhushan2008';
    const params=new URLSearchParams(location.search);
    const repoName=params.get('repo');
    const nameEl=document.getElementById('project-name');
    const descriptionEl=document.getElementById('description');
    const languageEl=document.getElementById('language');
    const metaEl=document.getElementById('meta');
    const actionsEl=document.getElementById('actions');
    const readmeEl=document.getElementById('readme');
    const noteEl=document.getElementById('demo-note');
    const errorEl=document.getElementById('error');
    const codePanel=document.getElementById('code-panel');
    const codeFile=document.getElementById('code-file');
    const codeStatus=document.getElementById('code-status');
    const codeScroll=document.getElementById('code-scroll');
    const sourceCode=document.getElementById('source-code');
    let repository=null;
    let sourceFiles=[];
    let codeLoaded=false;

    const badge=text=>{const span=document.createElement('span');span.className='badge';span.textContent=text;metaEl.append(span)};
    const linkButton=(text,url,secondary=false)=>{const a=document.createElement('a');a.className='button'+(secondary?' secondary':'');a.textContent=text;a.href=url;a.target='_blank';a.rel='noopener noreferrer';actionsEl.append(a);return a};
    const actionButton=(text,onClick,secondary=false)=>{const button=document.createElement('button');button.type='button';button.className='button'+(secondary?' secondary':'');button.textContent=text;button.addEventListener('click',onClick);actionsEl.append(button);return button};

    async function loadProject(){
      if(!repoName||!/^[a-zA-Z0-9._-]{1,100}$/.test(repoName))throw new Error('Missing or invalid repository name. Go back and choose a project.');
      const response=await fetch(`https://api.github.com/repos/${owner}/${encodeURIComponent(repoName)}`);
      if(!response.ok)throw new Error(response.status===404?'That public repository could not be found.':'GitHub could not load this project right now. Please try again later.');
      repository=await response.json();
      if(repository.owner.login.toLowerCase()!==owner.toLowerCase()||repository.fork)throw new Error('This project is not available in the public project list.');
      document.title=`${repository.name} | Brijbhushan Sharma`;
      nameEl.textContent=repository.name.replaceAll('_',' ');
      languageEl.textContent=repository.language||'GitHub project';
      descriptionEl.textContent=repository.description||'Open the source repository to learn more about this project.';
      badge(`★ ${repository.stargazers_count} stars`);badge(`${repository.forks_count} forks`);
      if(repository.language)badge(repository.language);
      if(repository.pushed_at)badge(`Updated ${new Date(repository.pushed_at).toLocaleDateString()}`);
      if(repository.homepage){linkButton('Try the app ↗',repository.homepage);noteEl.hidden=true;}
      else{noteEl.textContent='There is no live demo URL set for this repository yet. Check its README for instructions to download or run the project.';noteEl.hidden=false;}
      linkButton('View source on GitHub ↗',repository.html_url,true);
      actionButton('View code',toggleCode,true);
      const readmeResponse=await fetch(`https://api.github.com/repos/${owner}/${encodeURIComponent(repository.name)}/readme`);
      if(readmeResponse.ok){
        const readme=await readmeResponse.json();
        const bytes=Uint8Array.from(atob(readme.content.replace(/\s/g,'')),char=>char.charCodeAt(0));
        readmeEl.textContent=new TextDecoder().decode(bytes);
        readmeEl.classList.remove('loading');
      }else{
        readmeEl.textContent='This repository does not have a README yet. Use the GitHub button above to browse its files.';
        readmeEl.classList.remove('loading');
      }
    }

    async function loadSourceFiles(){
      codeStatus.textContent='Finding source files…';
      const treeResponse=await fetch(`https://api.github.com/repos/${owner}/${encodeURIComponent(repository.name)}/git/trees/${encodeURIComponent(repository.default_branch)}?recursive=1`);
      if(!treeResponse.ok)throw new Error('Could not load the repository file list. Try the View source on GitHub button instead.');
      const tree=await treeResponse.json();
      const allowed=/\.(py|js|jsx|ts|tsx|html|css|java|c|h|cpp|hpp|ino|json|sh|rb|go|rs|php|sql|md)$/i;
      sourceFiles=(tree.tree||[]).filter(file=>file.type==='blob'&&allowed.test(file.path)&&!/(^|\/)(node_modules|vendor|\.git|dist|build)\//i.test(file.path)&&!(/\.min\.(js|css)$/i.test(file.path))&&file.size<=250000).sort((a,b)=>a.path.localeCompare(b.path));
      if(!sourceFiles.length){codeStatus.textContent='No supported source files were found in this repository.';return;}
      codeFile.replaceChildren();
      sourceFiles.forEach((file,index)=>{const option=document.createElement('option');option.value=String(index);option.textContent=file.path;codeFile.append(option);});
      codeFile.hidden=false;
      codeStatus.textContent=`${sourceFiles.length} source file${sourceFiles.length===1?'':'s'} available.`;
      codeLoaded=true;
      await showSelectedFile();
    }

    async function showSelectedFile(){
      const file=sourceFiles[Number(codeFile.value)];
      if(!file)return;
      codeStatus.textContent=`Loading ${file.path}…`;
      codeScroll.hidden=true;
      try{
        const fileUrl=`https://raw.githubusercontent.com/${owner}/${repository.name}/${encodeURIComponent(repository.default_branch)}/${file.path.split('/').map(encodeURIComponent).join('/')}`;
        const response=await fetch(fileUrl);
        if(!response.ok)throw new Error('Could not load this source file.');
        sourceCode.textContent=await response.text();
        codeScroll.hidden=false;
        codeStatus.textContent=file.path;
      }catch(error){codeStatus.textContent=error.message;}
    }

    async function toggleCode(){
      codePanel.hidden=false;
      if(codeLoaded){codePanel.scrollIntoView({behavior:'smooth',block:'start'});return;}
      try{await loadSourceFiles();codePanel.scrollIntoView({behavior:'smooth',block:'start'});}
      catch(error){codeStatus.textContent=error.message;}
    }
    codeFile.addEventListener('change',showSelectedFile);
    loadProject().catch(error=>{nameEl.textContent='Project unavailable';descriptionEl.textContent='';readmeEl.textContent='';readmeEl.classList.remove('loading');errorEl.textContent=error.message;errorEl.hidden=false;});
  </script>
</body>
</html>
